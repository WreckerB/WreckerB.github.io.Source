name: Deploy to GitHub Pages

# 源码仓库：WreckerB/WreckerB.github.io.Source
# 构建产物推送到：WreckerB/WreckerB.github.io（该仓库需设置为「Deploy from a branch」→ main → /）
# 包管理器：pnpm（版本由 package.json 的 packageManager 字段锁定）

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # 必须排在 setup-node 之前：setup-node 的 cache: pnpm 需要 pnpm 已在 PATH 上
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Generate static site
        run: pnpm generate
        env:
          # 站点部署在用户/组织根路径 wreckerb.github.io，无需子路径前缀
          NUXT_APP_BASE_URL: /

      - name: Checkout pages repository
        uses: actions/checkout@v4
        with:
          repository: WreckerB/WreckerB.github.io
          ref: main
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: .pages

      - name: Sync build output
        run: |
          cd .pages
          # 清空旧产物，保留 .git 与仓库自身配置
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          cp -r ../.output/public/. .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --staged --quiet; then
            echo 'no changes to deploy'
          else
            git commit -m "deploy: ${GITHUB_SHA::8}"
            git push
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: .output/public
          retention-days: 7
